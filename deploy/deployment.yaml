apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: shekel-backend:bootstrap
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: password
            - name: DATABASE_URL
              value: postgresql+asyncpg://shekel:$(POSTGRES_PASSWORD)@postgresql.infrastructure.svc.cluster.local:5432/shekel
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis-master.infrastructure.svc.cluster.local:6379/0
            - name: KAFKA_ENABLED
              value: "true"
            - name: KAFKA_BROKERS
              value: kafka.infrastructure.svc.cluster.local:9092
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch.infrastructure.svc.cluster.local:9200
            - name: KEYCLOAK_ISSUER
              value: memory://
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
spec:
  ingressClassName: nginx
  rules:
    - host: api.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80